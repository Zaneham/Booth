name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make test

  # Reports only, no threshold. We don't know the baseline yet, and a gate set
  # from a guess just gets ignored. Add --fail-under-line once the number settles.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gcovr
        run: pipx install "gcovr>=8"
      - name: Build instrumented and run suite
        run: make coverage
      - name: Summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html/

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make
      - name: Build
        run: make
      - name: Test
        run: make test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      # The full test suite is not macOS-clean yet (header paths, clang
      # nits), so it is informational here. The Metal check below is the
      # gate that actually matters for this job.
      - name: Test
        continue-on-error: true
        run: make test
      # The headline: GitHub's macOS runners ship the Metal toolchain, so
      # CI can compile the MSL the Metal backend emits and prove it is
      # real Metal, not just plausible-looking text.
      - name: Validate emitted Metal compiles with xcrun
        run: |
          printf '%s\n' \
            '__global__ void vadd(float* a, float* b, float* out, int n) {' \
            '    int i = blockIdx.x * blockDim.x + threadIdx.x;' \
            '    if (i < n) out[i] = a[i] + b[i];' \
            '}' > vadd.cu
          ./kath --metal vadd.cu -o vadd.metal
          echo '--- emitted MSL ---'
          cat vadd.metal
          xcrun -sdk macosx metal -c vadd.metal -o vadd.air
          echo 'METAL TOOLCHAIN ACCEPTED THE EMITTED MSL'
